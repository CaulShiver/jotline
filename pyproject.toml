[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "jotline"
dynamic = ["version"]
description = "A quiet terminal workspace for capturing thoughts and connecting notes."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "CaulShiver"}]
keywords = ["markdown", "notes", "terminal", "textual", "writing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Topic :: Text Editors",
  "Topic :: Utilities",
]
dependencies = ["textual>=8.2.8,<9"]

[project.urls]
Homepage = "https://github.com/CaulShiver/jotline"
Repository = "https://github.com/CaulShiver/jotline"
Issues = "https://github.com/CaulShiver/jotline/issues"

[project.scripts]
jotline = "jotline.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.hatch.version]
path = "src/jotline/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/jotline"]
