[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "jotline"
dynamic = ["version"]
description = "A quiet terminal workspace for capturing thoughts and connecting notes."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "CaulShiver"}]
keywords = ["markdown", "notes", "terminal", "textual", "writing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Topic :: Text Editors",
  "Topic :: Utilities",
]
dependencies = ["textual>=8.2.8,<9", "markdown-it-py>=4,<5"]

[project.urls]
Homepage = "https://github.com/CaulShiver/jotline"
Repository = "https://github.com/CaulShiver/jotline"
Issues = "https://github.com/CaulShiver/jotline/issues"
Changelog = "https://github.com/CaulShiver/jotline/blob/main/CHANGELOG.md"
Documentation = "https://github.com/CaulShiver/jotline/blob/main/docs/install.md"

[project.scripts]
jotline = "jotline.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.24", "ruff>=0.14,<0.15"]
encryption = ["cryptography>=42"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.hatch.version]
path = "src/jotline/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/jotline"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["exa-results"]

[tool.ruff.lint]
# Defects, not style. Pyflakes catches a stale name, an unused import and a
# f-string that lost its placeholder; bugbear catches the traps that read as
# correct, above all a closure that captures the loop variable. The style sets
# (UP, SIM, RUF, C4, PERF) report about a hundred findings across the tree and
# are a separate decision from having a linter at all, so they stay off until
# someone wants to make it.
select = ["F", "E9", "B"]
ignore = [
  "B905",     # zip(strict=) changes behaviour; each site needs its own read.
]

[tool.ruff.lint.per-file-ignores]
# A bare assert False in a test is the test failing on purpose.
"tests/*" = ["B011"]
