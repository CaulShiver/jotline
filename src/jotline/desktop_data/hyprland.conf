# Jotline quick capture. Pick a free key; Super+Shift+J is the example.
# Reload with: hyprctl reload
#
# Option A — one command. jotline desktop launch opens a terminal with
# class org.jotline.capture so these window rules float it.
windowrulev2 = float, class:^(org.jotline.capture)$
windowrulev2 = size 760 420, class:^(org.jotline.capture)$
windowrulev2 = center, class:^(org.jotline.capture)$
bind = SUPER SHIFT, J, exec, __JOTLINE__ desktop launch
#
# Option B — spawn a known terminal yourself (swap kitty for foot, alacritty, or ghostty).
# bind = SUPER SHIFT, J, exec, [float; size 760 420; center] kitty --class org.jotline.capture -e __JOTLINE__ capture
