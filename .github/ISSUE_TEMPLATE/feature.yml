name: Workflow improvement
description: Explain a task Jotline could make easier.
body:
  - type: textarea
    id: task
    attributes:
      label: What are you trying to do?
      description: Describe the writing or review task and where you get stuck.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested behavior
      description: Include an example and any workaround you use today.
  - type: textarea
    id: fit
    attributes:
      label: Terminal and offline considerations
      description: Optional keyboard, platform, accessibility or external-service requirements.
