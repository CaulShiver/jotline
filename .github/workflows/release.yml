name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/test.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check release identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release_metadata.py
      - name: Build and checksum packages
        run: |
          python -m pip install uv==0.12.10
          uv build --clear
          python scripts/release_metadata.py --checksums
      - name: Smoke-test the exact release wheel
        run: |
          uv venv /tmp/jotline-release-smoke
          uv pip install --python /tmp/jotline-release-smoke/bin/python --strict dist/*.whl
          /tmp/jotline-release-smoke/bin/python -I scripts/smoke_install.py
          /tmp/jotline-release-smoke/bin/python -I scripts/smoke_pty.py
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS --verify-tag --title "Jotline $RELEASE_TAG" --notes-file docs/release-notes.md
