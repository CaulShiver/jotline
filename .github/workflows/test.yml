name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        timeout-minutes: 2
        run: python -m pip install uv==0.12.10
      - name: Check locked project resolve
        timeout-minutes: 2
        run: uv lock --check --python '${{ matrix.python }}'
      - name: Check latest dependency resolve
        if: matrix.python == '3.13'
        timeout-minutes: 4
        run: uv lock --upgrade --dry-run --python '${{ matrix.python }}'
      - name: Check direct lower bounds
        if: matrix.python == '3.11' && matrix.os == 'ubuntu-latest'
        timeout-minutes: 5
        run: |
          uv venv /tmp/jotline-lower-bound --python '${{ matrix.python }}'
          uv pip install --python /tmp/jotline-lower-bound/bin/python --strict -e . 'textual==8.2.8' 'pytest==8.2.0' 'pytest-asyncio==0.24.0'
          /tmp/jotline-lower-bound/bin/python -m pytest -q tests/test_cli_redteam.py tests/test_packaging.py
      - name: Sync locked test environment
        timeout-minutes: 4
        run: uv sync --locked --extra dev --python '${{ matrix.python }}'
      - name: Run tests
        timeout-minutes: 5
        run: uv run --locked pytest -q
      - name: Build distributions
        timeout-minutes: 3
        run: uv build --clear
      - name: Install and exercise the built wheel in a clean venv
        timeout-minutes: 4
        run: |
          uv venv .smoke-venv --python '${{ matrix.python }}'
          if [ "$RUNNER_OS" = "Windows" ]; then
            smoke_python=.smoke-venv/Scripts/python.exe
          else
            smoke_python=.smoke-venv/bin/python
          fi
          uv pip install --python "$smoke_python" --strict dist/*.whl
          "$smoke_python" -I scripts/smoke_install.py
