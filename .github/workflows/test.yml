name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.10
      - run: uv sync --locked --extra dev --python '${{ matrix.python }}'
      - run: uv run --locked pytest -q
      - run: uv build
      - name: Install and exercise the built wheel
        run: |
          uv pip install --python .venv/bin/python --no-deps --reinstall dist/*.whl
          .venv/bin/python -I scripts/smoke_install.py
